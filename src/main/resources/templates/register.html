<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Campus Lost &amp; Found</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="main-content">

    <div class="form-card" style="max-width: 480px;">
        <div class="form-header">
            <h2>Create Campus Account</h2>
            <p>Join to report lost belongings or claim found property</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <form th:action="@{/register}" th:object="${userDto}" method="post">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g., Pooja Sharma" required>
                <div class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Campus Email Address</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@college.edu" required>
                <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                <div class="form-text">Used for sign in and notifications regarding your claims.</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Minimum 6 characters" required>
                <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
                Register Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b;">
            Already have an account? <a th:href="@{/login}" style="font-weight: 600;">Sign in here</a>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
