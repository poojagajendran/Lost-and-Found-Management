spring.application.name=lostfound-test

# In-Memory H2 Database for Testing
spring.datasource.url=jdbc:h2:mem:lost_found_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.admin.email=admin@lostfound.edu
app.admin.password=Admin@123
app.admin.name=System Administrator
